<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="form1" name="form1" action method="post">

        <h3 id="titulo">
            <img alt src="logo-dona-helena@2x (1).webp">

            FORMULÁRIO MÉDICO
            <br>
            CADASTRO DO PACIÊNTE
        </h3>

        <p class="obs">
            "* os campos com fundo branco devem ser preenchidos, confirme solicitado pela ANS"</p>
        <p class="obs"> * As datas devem estar no formato DD/MM/AA </p>

        <br> 

        <label>1- Registro ANS
            <input type="text" maxLength="6" size="20" name="textfield">
          </label>
          <label class="obr">3 - Data de Autoriza&ccedil;&atilde;o
            <input type="text" maxLength="8" size="20" name="textfield3">
          </label>
          <label class="obr">4 - Senha
            <input type="text" maxLength="20" size="20" name="textfield4">
          </label>
          <label class="obr">5 - Data de Validade da Senha
            <input type="text" maxLength="8" size="20" name="textfield5">
          </label>
          <label>6 - Data de Emiss&atilde;o da Guia
            <input type="text" maxLength="8" size="20" name="textfield6">
          </label>


          <fieldset>
            <legend>DADOS PESSOAIS </legend>
            <label>7 - Nome completo do Paciênte
              <input type="text" maxLength="20" size="50" name="textfield7">
            </label>
            <label>8 - Data de nascimento
              <input type="date" maxLength="20" name="textfield8">
            </label>
            <label class="obr">9 - Validade da Carteira
              <input type="text" maxLength="8" name="textfield9">
            </label>
            <label>10 - 
              Nome
              <input type="text" maxLength="70" size="70" name="textfield10">
            </label>
            <label class="obr">11 - N&uacute;mero 
              do Cart&atilde;o Nacional de Sa&uacute;de
              <input type="text" maxLength="15" size="20" name="textfield11">
            </label>
          </fieldset>
          <fieldset>

        <fieldset>



            <legend>
                <h3>Dados Pessoais </h3>
            </legend>
            <label for="nome"> Nome completo do Paciênte: </label>
            <input type="text" id="nome" name="nome_paciente">

            <br>
            <br>

            <label for="nascimento"> Data de Nascimento: </label>
            <input type="date" id="nascimento" name="nascimento"> </iput>

            <br>
            <br>

            <label for="endereco"> Endereço </label>
            <input type="endereco" id="endereco" name="endereco">

            <br>
            <br>

            <label for="telefone"> Telefone: </label>
            <input type="tel" id="telefone" name="telefone_paciente" placeholder="(00) 00000-0000">

            <br>
            <br>

            <label for="email"> Email: </label>
            <input type="email" id="email" name="email_paciente" placeholder="seu@gmail.com" required
                title="Por favor, insira um e-mail válido (ex: nome@provedor.com)">




            <legend>
                <h3> Genêro </h3>
            </legend>



            <label for="Masculino"> Masculino </label>
            <input type="radio" id="Masculino" name="genero" value="Masculino">

            <br>

            <label for="Feminino"> Feminino</label>
            <input type="radio" id="Feminino" name="genero" value="Feminino">



            <fieldset>

                <legend>
                    <h3>Outras informações médicas relevantes </h3>
                </legend>

                <h3> O paciênte tem algum histórico de doenças? </h3>

                <br>
                <label for="sim"> Sim </label>
                <input type="radio" id="sim" name="sim" value="sim">
                <br>

                <label for="msg"> Quais? </label>
                <textarea id="msg" name-msg_usuario></textarea>

                <br>
                <br>

                <label for="nao"> Não </label>
                <input type="radio" id="nao" name="sim" value="nao">

                <br>
                <br>

                <label for="nomeMedico"> Nome do Médico Responsável </label>
                <input type="text" id="medico" name="medico_usuario">

            </fieldset>

            <fieldset>
                <label for="enviar"> Eniviar formulário médico -> </label>
                <input type="enviar" value="enviar">
            </fieldset>

        </fieldset>

























    </form>

</body>

</html>
