<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário paciênte</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="form1" name="form1" action method="post">

        <h3 id="titulo">
            <img alt src="logo-dona-helena@2x (1).webp">

            FORMULÁRIO MÉDICO
            <br>
            CADASTRO DO PACIÊNTE
        </h3>

        <br>

        <p class="obs">
            * os campos devem ser preenchidos conforme solicitado pelo Médico responsável </p>
        <p class="obs"> * As datas devem estar no formato DD/MM/AA </p>

        <br>

        <fieldset>
            <legend>DADOS PESSOAIS </legend>
            <label>1 - Nome completo do Paciênte
                <input type="tel" maxLength="40" size="50" name="textfield7">
            </label>
            <label>2 - Data de nascimento
                <input type="tel" maxLength="40" name="textfield8">
            </label>
            <label class="obr">3 - Endereço
                <input type="tel" maxLength="40" name="textfield9">
            </label>
            <label>4 -
                Telefone
                <input type="tel" maxLength="70" size="70" name="textfield10">
            </label>
            <label class="obr">5 - Email
                <input type="text" maxLength="70" size="20" name="textfield11" placeholder="seu@gmail.com" required>
            </label>
        </fieldset>


        <fieldset>
            <legend>
                <h3> GENÊRO </h3>
            </legend>
            <label> 6 - Masculino
                <input type="radio" id="Masculino" name="genero" value="Masculino" size="70">
            </label>
            <label> 7 - Feminino
                <input type="radio" id="Feminino" name="genero" value="Feminino" size="70">
            </label>

        </fieldset>

        <fieldset>
            <br>
            <legend>
                <h3>
                    INFORMAÇÕES
                </h3>
            </legend>

            <br>

            <h3 id="histórico"> O paciênte tem algum histórico de doenças? </h3>

            <br>
            <label> 8 - Sim
                <input type="radio" id="sim" name="sim" value="sim" maxLength="20" size="70">
            </label>
            <label> 9 - Não
                <input type="radio" id="nao" name="sim" value="nao" maxLength="20" size="70">
            </label>
            <label> 10 - Nome do Médico Responsável
                <input type="text" id="medico" name="medico_usuario" maxLength="20" size="70">
            </label>
            <label> 11 - Se resposta anterior for sim, quais doenças/alegias?
                <input type="text" id="medico" name="medico_usuario" maxLength="20" size="70">
            </label>

        </fieldset>

        <fieldset>
            <label> Eniviar formulário médico ->
                <br>
                <input type="button" value="enviar">
            </label>
        </fieldset>

    </form>
</body>

</html>
